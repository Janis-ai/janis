name: agent-image

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/agent-image.yml'
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/agent-template/Dockerfile
          push: true
          tags: |
            ghcr.io/janis-ai/janis-agent:latest
            ghcr.io/janis-ai/janis-agent:${{ github.sha }}
