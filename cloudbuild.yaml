steps:
  # Warm the layer cache: pull the previous image so docker can --cache-from
  # it. Each Cloud Build run is a fresh VM — without this every deploy
  # redoes npm ci and all four workspace builds from scratch.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args: ['-c', 'docker pull gcr.io/$PROJECT_ID/janis-api:latest || true']
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - --cache-from
      - gcr.io/$PROJECT_ID/janis-api:latest
      - -t
      - gcr.io/$PROJECT_ID/janis-api:latest
      - -t
      - gcr.io/$PROJECT_ID/janis-api:$BUILD_ID
      - .
images:
  - gcr.io/$PROJECT_ID/janis-api:latest
  - gcr.io/$PROJECT_ID/janis-api:$BUILD_ID
# Note: deliberately on the default e2-medium builder — 120 free build-min/day.
# A non-default machineType (e.g. E2_HIGHCPU_8) bills every minute with no free
# tier, which at this repo's deploy cadence costs more than the time saved.
