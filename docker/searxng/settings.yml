# Janis web_search backend — JSON API only, datacenter-friendly engines.
# Google/Startpage get CAPTCHA'd on Cloud Run IPs; keep the resilient set.
use_default_settings: true

server:
  port: 8081
  bind_address: "127.0.0.1"   # localhost only — auth proxy fronts :8080
  secret_key: "janis-searxng-4f2a9d1c7e"
  limiter: false        # backend-only service; rate limiting lives upstream
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - json

ui:
  static_use_hash: true

engines:
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: mojeek
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: brave
    disabled: true     # scrapes brave.com — blocked on cloud IPs anyway
  - name: google
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
