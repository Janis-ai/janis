# Janis — Shopify App Store app config (Dev Dashboard apps are configured
# via this file through the CLI; mandatory compliance webhooks are
# toml-only in the new dashboard). `shopify app deploy` releases this as a
# new app version — keep it in sync with the dashboard form.

client_id = "bbc74ee5092894c6b45e93e24db1ede6"
name = "Janis"
application_url = "https://app.janis.ai/shopify-app"
embedded = true

[build]
# No shopify-managed build/dev — the app is our Cloud Run deploy.
automatically_update_urls_on_dev = false

[access_scopes]
# Bundled so the merchant re-consents once, not per-feature:
# write_returns (chat return requests), write_customers (self-serve
# account updates), write_discounts (approval-gated save-the-sale codes),
# read_checkouts (abandoned-checkout webhooks), read_reports (ShopifyQL
# sales analytics — exact bestseller/sell-through stats), read_inventory +
# read_locations (per-location stock truth — "is it at my store", and the
# only way to see stock that can't fulfill online orders), read_product_listings
# (sales-channel publication status — Admin 'availableForSale' ≠ Online
# Store availability).
scopes = "read_orders,write_orders,write_draft_orders,read_products,read_customers,read_legal_policies,write_returns,write_customers,write_discounts,read_checkouts,read_reports,read_inventory,read_locations,read_product_listings"

[auth]
# Managed install (token exchange) — no OAuth redirect endpoints.
redirect_urls = []

# Storefront app proxy — https://<shop>/apps/janis/* forwards to the API
# with Shopify's own signature (incl. logged_in_customer_id when the
# shopper holds a customer-account session). The widget's /session call is
# how a logged-in shopper gets a VERIFIED identity claim — see
# /api/shopify/proxy/session.
[app_proxy]
url = "https://app.janis.ai/api/shopify/proxy"
subpath = "janis"
prefix = "apps"

[webhooks]
api_version = "2026-10"

# Mandatory GDPR compliance topics — all three POST to one endpoint;
# the handler dispatches on x-shopify-topic. Required for App Store
# distribution (and the only place they can be declared).
[[webhooks.subscriptions]]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
uri = "https://app.janis.ai/shopify/webhooks"

[pos]
embedded = false
